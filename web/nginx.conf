# Serves the Angular app and proxies /api to the NestJS container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1200k;  # campaign banners are up to 1 MB

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Keep the real client IP from the host Nginx (needed for rate limiting).
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Never cache the service worker or app shell.
  location ~* ^/(ngsw-worker\.js|ngsw\.json|index\.html|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Hashed build assets — cache for a year.
  location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Angular routes (/join, /dashboard, /admin …)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
