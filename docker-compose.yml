# VCC Creator Portal — Hostinger VPS
#   docker compose up -d --build
# Only the web container is published, and only on 127.0.0.1:8080.
# The host's Nginx terminates HTTPS for vcreatorclub.in and proxies to it
# (see deploy/nginx-vcreatorclub.conf).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vcc
      POSTGRES_USER: vcc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - vcc_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # schema runs on first start only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vcc -d vcc"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://vcc:${POSTGRES_PASSWORD}@db:5432/vcc
      APP_URL: ${APP_URL:-https://vcreatorclub.in}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      ADMIN_SEED_SECRET: ${ADMIN_SEED_SECRET:-}
      ENABLE_ADMIN_SEED: ${ENABLE_ADMIN_SEED:-false}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  vcc_pgdata:
