# Host Nginx site for the VPS:
#   sudo cp deploy/nginx-vcreatorclub.conf /etc/nginx/sites-available/vcreatorclub
#   sudo ln -s /etc/nginx/sites-available/vcreatorclub /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d vcreatorclub.in -d www.vcreatorclub.in --redirect
# Certbot adds the 443 block and the HTTP→HTTPS redirect automatically.

server {
  listen 80;
  listen [::]:80;
  server_name vcreatorclub.in www.vcreatorclub.in;

  # Send www to the bare domain (the only domain used in QR links).
  if ($host = www.vcreatorclub.in) { return 301 https://vcreatorclub.in$request_uri; }

  # Co-Create idea documents are up to 10 MB (default would be 1 MB).
  client_max_body_size 11m;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
